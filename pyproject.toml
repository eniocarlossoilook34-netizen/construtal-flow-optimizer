[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "construtal-flow-optimizer"
version = "0.1.0"
description = "Construtal Flow Optimizer: A scientific computational laboratory for flow network evolution"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Enio Carlos", email = "eniocarlossoilook34@gmail.com"}
]
license = {text = "MIT"}

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
